      start_period: 15s

  indicadores-1:
    build:
      context: .
      target: indicadores
    container_name: coop-consumer-indicadores-1
    ports:
      - "8185:8185"
    environment:
      <<: *app-env
      SERVER_PORT: 8185
      INSTANCE_ID: indicadores-1
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      postgres:
