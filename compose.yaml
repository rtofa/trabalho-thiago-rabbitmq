    container_name: coop-consumer-indicadores-1
    ports:
      - "8185:8185"
    environment:
      <<: *app-env
      SERVER_PORT: 8185
      INSTANCE_ID: indicadores-1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      producer:
        condition: service_healthy
    healthcheck:
