    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      producer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8183/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  auditoria:
    build:
      context: .
      target: auditoria
    container_name: coop-consumer-auditoria
    ports:
      - "8184:8184"
    environment:
      <<: *app-env
      SERVER_PORT: 8184
