server:
  port: ${SERVER_PORT:8180}

spring:
  application:
    name: coop-producer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cooperativa}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

coop:
  painel:
    recepcao-url: ${COOP_RECEPCAO_URL:http://localhost:8181}
    comunicacao-url: ${COOP_COMUNICACAO_URL:http://localhost:8182}
    qualidade-url: ${COOP_QUALIDADE_URL:http://localhost:8183}
    auditoria-url: ${COOP_AUDITORIA_URL:http://localhost:8184}
    indicadores1-url: ${COOP_INDICADORES_1_URL:http://localhost:8185}
    indicadores2-url: ${COOP_INDICADORES_2_URL:http://localhost:8186}
    rabbitmq-management-url: ${RABBITMQ_MGMT_URL:http://localhost:15672}
    rabbitmq-user: ${RABBITMQ_USER}
    rabbitmq-password: ${RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
