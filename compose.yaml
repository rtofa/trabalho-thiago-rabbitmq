x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-cooperativa}
  DB_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
  DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: coop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq-init:
    image: curlimages/curl:latest
    container_name: coop-rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        i=0
        until curl -sf -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD" http://rabbitmq:15672/api/overview >/dev/null; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then
            echo "RabbitMQ Management API indisponivel" >&2
            exit 1
          fi
          sleep 1
        done
        curl -sf -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD" \
          -X POST -H "Content-Type: application/json" \
          --data-binary @/definitions.json \
          http://rabbitmq:15672/api/definitions
        echo "Topologia RabbitMQ importada com sucesso a partir de definitions.json"

  postgres:
    image: postgres:16-alpine
    container_name: coop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-cooperativa}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  producer:
    build:
      context: .
      target: producer
    container_name: coop-producer
    ports:
      - "8180:8180"
    environment:
      <<: *app-env
      SERVER_PORT: 8180
      COOP_RECEPCAO_URL: http://recepcao:8181
      COOP_COMUNICACAO_URL: http://comunicacao:8182
      COOP_QUALIDADE_URL: http://qualidade:8183
      COOP_AUDITORIA_URL: http://auditoria:8184
      COOP_INDICADORES_1_URL: http://indicadores-1:8185
      COOP_INDICADORES_2_URL: http://indicadores-2:8186
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8180/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  recepcao:
    build:
      context: .
      target: recepcao
    container_name: coop-consumer-recepcao
    ports:
      - "8181:8181"
    environment:
      <<: *app-env
      SERVER_PORT: 8181
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      producer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8181/actuator/health | grep -q UP"]
